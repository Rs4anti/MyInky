[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myinky"
version = "0.1.0"
description = "Local web application for a Waveshare 4.2-inch e-paper display"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10,<4.0",
    "Flask>=3.0,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "Pillow>=10.0,<13.0",
    "cryptography>=42.0",
    "filelock>=3.15,<4.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
include = ["inkdisplay*"]

[tool.setuptools.package-data]
inkdisplay = [
    "templates/*.html",
    "presentation/web/templates/_navbar.html",
    "presentation/web/templates/settings/*.html",
    "presentation/web/templates/photos/*.html",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "flask.*",
    "flask_migrate.*",
    "flask_wtf.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests covering multiple application components"]

[tool.coverage.run]
branch = true
source = ["inkdisplay"]
omit = ["inkdisplay/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true